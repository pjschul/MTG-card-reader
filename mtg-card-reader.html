<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Title reader for Magic cards</title>
<style>
    /* Colour palette (light theme) and the five-colour gradient used for the header stripe and progress bar */
    :root {
        --ink: #16202a;
        --mist: #e9edf0;
        --paper: #fff;
        --line: #cdd5db;
        --mute: #46535f;
        --ok: #1b6b3c;
        --warn: #8f5200;
        --bad: #a52a22;
        color-scheme: light dark;
        --wubrg: linear-gradient(90deg,#f1e8c6 0 20%,#2f7fc1 20% 40%,#3b3340 40% 60%,#d3452f 60% 80%,#2f8a55 80%);
    }
    /* Padding and borders count inside element widths */
    * {
        box-sizing: border-box;
    }
    /* Page background and base font; bottom padding keeps content clear of the fixed export bar */
    body {
        margin: 0;
        background: var(--mist);
        color: var(--ink);
        font: 16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
        padding-bottom: 150px;
    }
    /* Header with the five-colour stripe on top */
    header {
        background: var(--paper);
        border-bottom: 1px solid var(--line);
        border-top: 6px solid;
        border-image: var(--wubrg) 1;
        padding: 18px 16px 16px;
    }
    /* Title */
    h1 {
        font: 700 28px/1.1 Georgia,'Times New Roman',serif;
        margin: 0 0 6px;
    }
    /* Tagline under the title */
    header p {
        margin: 0;
        color: var(--mute);
        max-width: 46ch;
        font-size: 16px;
    }
    /* Centred content column */
    main {
        max-width: 760px;
        margin: 0 auto;
        padding: 14px 12px;
    }
    /* Row with the photo buttons (take photo / choose image / draw a title box) */
    .pick {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    /* Buttons (also used for labels that act as buttons); at least 44 px tall for touch */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        border-radius: 8px;
        font: 600 15px system-ui,sans-serif;
        cursor: pointer;
        text-decoration: none;
    }
    /* Primary (filled) button */
    .btn.pri {
        background: var(--ink);
        color: #fff;
    }
    /* Disabled button */
    .btn[disabled] {
        opacity: .45;
        cursor: default;
    }
    /* Clear blue focus ring for keyboard users */
    .btn:focus-visible,input:focus-visible,select:focus-visible {
        outline: 3px solid #2f7fc1;
        outline-offset: 2px;
    }
    /* Status line */
    #status {
        min-height: 24px;
        margin: 12px 0 6px;
        color: var(--ink);
        font-size: 15px;
    }
    /* Progress bar track and its filled part */
    #bar {
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 12px;
    }
    #bar i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--wubrg);
        transition: width .25s;
    }
    /* Error message box */
    #err {
        background: #fbeceb;
        border: 1px solid #e3b3af;
        color: #7d241e;
        padding: 10px 12px;
        border-radius: 8px;
        margin-bottom: 12px;
    }
    /* Photo area: the photo canvas with the overlay canvas and the selection rectangle on top */
    .stage {
        position: relative;
        touch-action: auto;
        cursor: crosshair;
        line-height: 0;
    }
    /* Draw mode: blue outline and no page scrolling while dragging on touch screens */
    .stage.draw {
        touch-action: none;
        outline: 3px solid #2f7fc1;
        outline-offset: 2px;
    }
    /* The photo scales to the width of the panel */
    .stage canvas {
        width: 100%;
        height: auto;
        border-radius: 6px;
    }
    /* Red rectangle shown while dragging a title box */
    #sel {
        position: absolute;
        border: 2px solid #d3452f;
        background: rgba(211,69,47,.18);
        pointer-events: none;
    }
    /* One card entry: thumbnail on the left, details on the right */
    .card {
        display: grid;
        grid-template-columns: 92px 1fr;
        gap: 12px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
    }
    /* Selected card: magenta frame, the same colour as its outline on the photo */
    .card.sel {
        box-shadow: 0 0 0 3px #d81bbd;
    }
    /* Card states: confirmed (green frame) */
    .card.confirmed {
        border-color: var(--ok);
        border-width: 2px;
    }
    /* Confirm button once the card is confirmed */
    .btn.cf.on {
        background: var(--ok);
        color: var(--paper);
        border-color: var(--ok);
    }
    /* Match needs checking (amber frame) */
    .card.low {
        border-color: var(--warn);
        border-width: 2px;
    }
    /* No match or an error (red frame) */
    .card.none,.card.err {
        border-color: var(--bad);
        border-width: 2px;
    }
    /* Thumbnail */
    .th {
        background: var(--mist);
        border-radius: 6px;
        display: flex;
        align-items: flex-start;
    }
    .th img {
        width: 100%;
        border-radius: 6px;
        display: block;
    }
    /* Top line of a card: number and status badge on the left, match percentage on the right */
    .top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 14px;
        font-weight: 700;
    }
    /* Status badge colours */
    .badge.ok {
        color: var(--ok);
    }
    .badge.low {
        color: var(--warn);
    }
    .badge.none,.badge.err {
        color: var(--bad);
    }
    /* Secondary text: match percentage, OCR text, set information */
    .pct,.ocr,.meta {
        color: var(--mute);
        font-size: 14px;
    }
    /* OCR text may wrap anywhere */
    .ocr {
        display: block;
        word-break: break-word;
    }
    /* Editable card name field */
    .nm {
        width: 100%;
        min-height: 44px;
        margin: 6px 0 4px;
        padding: 0 10px;
        background: var(--paper);
        border: 1px solid var(--mute);
        border-radius: 8px;
        font: 600 17px Georgia,serif;
        color: var(--ink);
    }
    /* Small picture of the strip the OCR actually read */
    .dbg {
        display: block;
        max-width: 100%;
        height: 34px;
        object-fit: contain;
        object-position: left;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        margin-top: 6px;
    }
    /* Row of action buttons on a card */
    .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
    }
    /* Slightly smaller buttons inside cards */
    .acts .btn {
        min-height: 38px;
        padding: 0 12px;
        font-size: 14px;
    }
    /* Photo panel */
    #photo {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 12px;
    }
    /* Hint line above the photo */
    .phead {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 15px;
    }
    .phead .btn {
        min-height: 36px;
    }
    /* Overlay canvas with outlines and numbers, exactly on top of the photo; clicks pass through to the photo */
    #ov {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    /* Brief blue highlight after jumping to a card from the photo */
    .card.focus {
        box-shadow: 0 0 0 3px #2f7fc1;
    }
    /* Round number badge that matches the number on the photo */
    .num {
        display: inline-block;
        min-width: 24px;
        padding: 0 7px;
        margin-right: 8px;
        border-radius: 12px;
        background: var(--ink);
        color: var(--paper);
        text-align: center;
    }
    /* Small caption above the name field */
    .edit {
        display: block;
        margin-top: 6px;
        font-size: 13px;
        color: var(--mute);
    }
    /* Export bar fixed to the bottom of the screen (respects the iPhone safe area) */
    #export {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--paper);
        border-top: 1px solid var(--line);
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom,0px));
    }
    /* Content of the export bar, centred and wrapping */
    #export>div {
        max-width: 760px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
    }
    /* Format dropdown */
    #export select {
        min-height: 44px;
        border: 1px solid var(--ink);
        border-radius: 8px;
        padding: 0 8px;
        background: var(--paper);
        font-size: 15px;
    }
    /* Checkbox labels */
    #export label {
        font-size: 15px;
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--ink);
    }
    /* Count line (full width, below the controls) */
    #count {
        flex-basis: 100%;
        font-size: 14px;
        color: var(--mute);
    }
    /* Wider screens: larger thumbnails */
    @media (min-width: 600px) {
        .card {
            grid-template-columns: 120px 1fr;
        }
    }
    /* Dark theme: lighter text, darker surfaces and brighter status colours */
    @media (prefers-color-scheme: dark) {
        :root {
            --ink: #f2f6f9;
            --mist: #0f151a;
            --paper: #1c252e;
            --line: #3d4b58;
            --mute: #c0ccd6;
            --ok: #6fdc9a;
            --warn: #f5b95c;
            --bad: #ff958b;
        }
        .btn {
            border-color: #8fa1b0;
        }
        .btn.pri {
            border-color: #f2f6f9;
        }
        .nm {
            border-color: #8fa1b0;
        }
        .btn.pri {
            background: #e8edf1;
            color: #12181e;
        }
        #err {
            background: #3a1d1b;
            color: #f2c3bf;
            border-color: #6d3430;
        }
    }
    /* Desktop: photo on the left (stays in view while scrolling) and the card list on the right */
    @media (min-width: 960px) {
        main {
            max-width: 1240px;
        }
        .work {
            display: grid;
            grid-template-columns: minmax(0,1.15fr) minmax(0,1fr);
            gap: 16px;
            align-items: start;
        }
        #photo {
            position: sticky;
            top: 12px;
            margin-bottom: 0;
        }
    }
  </style>
</head>
<body>
<!-- Page header -->
<header>
  <h1>Title reader</h1>
  <p>Photograph your Magic cards. Titles are read on this device and matched against Scryfall's card list.</p>
</header>
<!-- Main content: buttons, status, photo and card list -->
<main>
    <!-- Photo input: camera capture, file chooser, and a button that switches on title-box drawing -->
<div class="pick">
    <label class="btn pri">Take photo<input id="cam" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn">Choose image<input id="file" type="file" accept="image/*" hidden></label>
    <button class="btn" id="manualBtn" disabled>Draw a title box</button>
  </div>
    <!-- Status text, progress bar (filled by progress()) and error message (shown by showErr()) -->
<div id="status" role="status"></div>
  <div id="bar"><i></i></div>
  <div id="err" role="alert" hidden></div>
    <!-- Two columns on desktop: photo panel and card list -->
<div class="work">
        <!-- Photo panel: hint text, a "Done / Cancel" button for draw mode, the photo canvas (#src),
         the overlay canvas with outlines and numbers (#ov) and the red selection rectangle (#sel) -->
<section id="photo" hidden>
      <div class="phead"><span id="phelp"></span><button class="btn" id="pcancel" hidden>Cancel</button></div>
      <div class="stage" id="stage"><canvas id="src"></canvas><canvas id="ov"></canvas><div id="sel" hidden></div></div>
    </section>
        <!-- Card entries are inserted here by mk() -->
<section id="list"></section>
  </div>
    <!-- Name suggestions for the card name fields, filled while typing -->
<datalist id="dl"></datalist>
</main>
<!-- Export bar: format, download, copy, filters and the count line -->
<footer id="export" hidden>
  <div>
    <select id="fmt" aria-label="File format">
      <option value="csv">CSV</option><option value="txt">Plain text deck list</option><option value="json">JSON</option>
    </select>
    <button class="btn pri" id="dlBtn">Download</button>
    <button class="btn" id="cpBtn">Copy list</button>
    <label><input type="checkbox" id="inc"> Include unmatched</label>
    <label><input type="checkbox" id="onlyc"> Only confirmed</label>
    <span id="count"></span>
  </div>
</footer>

<!-- OpenCV.js (computer vision) and Tesseract.js (OCR), loaded from CDNs -->
<script src="https://docs.opencv.org/4.8.0/opencv.js" async></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<!-- Application code -->
<script>
/*
 * MTG title reader - everything runs in the browser, no AI / LLM services.
 *
 * Pipeline for an uploaded photo:
 *   1. detect(): find card outlines with OpenCV (also partly covered cards) and straighten each card.
 *   2. analyze(): cut the title strip, preprocess it and read it with Tesseract.js (OCR).
 *   3. bandScan(): look for title bars between long parallel edges, for cards the outline step missed.
 *   4. match(): fuzzy-match the OCR text against Scryfall's card-name list (cached in IndexedDB).
 *   5. resolve(): fetch the card from Scryfall (rate limited) to get set, collector number and Gatherer link.
 *   6. The user can confirm, edit or redo cards, then download / copy the list.
 */
// Shorthand for document.getElementById.
const $ = id => document.getElementById(id);
// Application state:
//   cards   - one object per identified card (title text, match, Scryfall data, outline shape on the photo ...)
//   srcC    - canvas holding the uploaded photo (scaled down to at most 2000 px)
//   nid     - counter that gives every card a unique id
//   target  - card currently being re-read with 'Redo on photo' (null = a new card is added instead)
//   queue   - promise chain so OCR jobs run one after another (a single Tesseract worker is shared)
let cards = [], srcC = null, nid = 0, target = null, queue = Promise.resolve();
// Scryfall card-name list and lookup tables:
//   names   - official card names        keys   - normalised search keys (also front faces of double-faced cards)
//   owners  - owners[i] is the official name belonging to keys[i]
//   nameMap - normalised key -> official name (fast exact lookup)
//   namesReady - promise that resolves once the list is loaded
let names = [], keys = [], owners = [], nameMap = new Map(), namesReady = Promise.resolve();
// Cache of Scryfall card lookups, keyed by lower-case card name.
const sfCache = new Map();
// covered - visible outlines (quadrilaterals) of cards found by outline detection; the title-bar scan skips them
// marks   - detection marks collected for debugging (no longer drawn)
// taken   - photo regions already claimed by an accepted title bar
let covered = [], marks = [], taken = [];
// ==================== Scryfall (rate-limited ~100ms) ====================
// Promise chain used to space Scryfall requests at least 100 ms apart.
let gate = Promise.resolve();
// Rate-limited fetch for Scryfall. Each request waits for the previous one plus 100 ms.
// Browsers set User-Agent themselves; only the Accept header can be supplied here.
const sf = url => {
    const p = gate.then(() => fetch(url, { headers: { Accept: 'application/json;q=0.9,*/*;q=0.8' } }));
    // Make the next request wait 100 ms after this one finishes (even if it failed).
    gate = p.catch(() => { }).then(() => new Promise(r => setTimeout(r, 100)));
    return p;
};
// Fetch a card by exact name from Scryfall. Returns the card object, or null if no such card (HTTP 404).
async function scry(name) {
    const k = name.toLowerCase();
    if (sfCache.has(k))
        return sfCache.get(k);
    const r = await sf('https://api.scryfall.com/cards/named?exact=' + encodeURIComponent(name));
    if (r.status === 404)
        return null;
    if (!r.ok)
        throw new Error('Scryfall returned ' + r.status);
    const d = await r.json();
    sfCache.set(k, d);
    return d;
}
// ==================== Name list: IndexedDB cache + fuzzy match ====================
// Tiny IndexedDB helper: idb('get', key) reads a value, idb('put', key, value) stores one (database 'mtg-scan').
const idb = (m, k, v) => new Promise((res, rej) => {
    const o = indexedDB.open('mtg-scan', 1);
    o.onupgradeneeded = () => o.result.createObjectStore('kv');
    o.onsuccess = () => {
        const s = o.result.transaction('kv', m === 'get' ? 'readonly' : 'readwrite').objectStore('kv');
        const r = m === 'get' ? s.get(k) : s.put(v, k);
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
    };
    o.onerror = () => rej(o.error);
});
// Normalise text for comparison: remove accents, lower-case, turn punctuation into spaces, collapse spaces.
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
// Load the card-name list: from the IndexedDB cache if it is under 7 days old, otherwise download it from Scryfall.
// If the download fails but an old copy exists, the old copy is used.
async function loadNames() {
    if (names.length)
        return;
    let c = await idb('get', 'names').catch(() => null);
    if (!c || Date.now() - c.t > 7 * 864e5) {
        try {
            status('Downloading the card name list (first run only)…');
            const r = await sf('https://api.scryfall.com/catalog/card-names');
            if (!r.ok)
                throw 0;
            const d = await r.json();
            c = { t: Date.now(), names: d.data };
            idb('put', 'names', c).catch(() => { });
        }
        catch (e) {
            if (!c)
                throw new Error("Couldn't download Scryfall's card name list. Check your connection and try again.");
        }
    }
    // Build the lookup tables from the list.
    names = c.names;
    for (const n of names) {
        const k = norm(n);
        keys.push(k);
        owners.push(n);
        nameMap.set(k, n);
        // Double-faced cards are named 'Front // Back'; also make them findable by the front face alone.
        if (n.includes(' // ')) {
            const f = norm(n.split(' // ')[0]);
            keys.push(f);
            owners.push(n);
            if (!nameMap.has(f))
                nameMap.set(f, n);
        }
    }
}
// Levenshtein edit distance between a and b. Gives up early (returns max + 1) once the distance must exceed max.
function lev(a, b, max) {
    if (Math.abs(a.length - b.length) > max)
        return max + 1;
    let p = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
        const c = [i];
        let mn = i;
        for (let j = 1; j <= b.length; j++) {
            const v = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
            c[j] = v;
            if (v < mn)
                mn = v;
        }
        if (mn > max)
            return max + 1;
        p = c;
    }
    return p[b.length];
}
// Fuzzy-match OCR text against the name list. Returns {name, score 0..1} or null.
// 'lim' optionally limits the allowed distance to a fraction of the text length.
function match(text, lim) {
    const q = norm(text);
    if (q.length < 2 || !keys.length)
        return null;
    // Exact match after normalisation: done.
    const ex = nameMap.get(q);
    if (ex)
        return { name: ex, score: 1 };
    // Scan every name, keeping the closest one (the running best distance also speeds up lev).
    let best = Math.min(q.length, Math.ceil(q.length * (lim || 1))), bi = -1;
    for (let i = 0; i < keys.length; i++) {
        const d = lev(q, keys[i], best);
        if (d < best || (d === best && bi < 0)) {
            best = d;
            bi = i;
            if (d === 0)
                break;
        }
    }
    if (bi < 0)
        return null;
    // Score = 1 - distance / length of the longer string.
    let res = { name: owners[bi], score: Math.max(0, 1 - best / Math.max(q.length, keys[bi].length)) };
    // Weak result: the title may be cut off because the card is partly covered.
    // Look for the shortest name that starts with the text; its score is capped at .79 so the card is flagged for checking.
    if (res.score < .7 && q.length >= 5) {
        let pk = -1;
        for (let i = 0; i < keys.length; i++)
            if (keys[i].startsWith(q) && (pk < 0 || keys[i].length < keys[pk].length))
                pk = i;
        if (pk >= 0) {
            const ps = Math.min(.79, .6 + .2 * q.length / keys[pk].length);
            if (ps > res.score)
                res = { name: owners[pk], score: ps };
        }
    }
    return res;
}
// ==================== Image loading ====================
// Decode the uploaded file (EXIF rotation is applied by the browser) and shrink it so the long side is at most 2000 px.
async function loadImage(file) {
    const bmp = await createImageBitmap(file).catch(() => null);
    if (!bmp)
        throw new Error("That file couldn't be read as an image. Try a JPG or PNG.");
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k);
    c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return c;
}
// ==================== OpenCV: detect, warp, binarize ====================
// Promise that resolves when OpenCV.js is ready. It polls every 100 ms, supports builds that expose cv as a Promise, and gives up after 60 s.
const cvReady = new Promise((res, rej) => {
    let n = 0;
    (function chk() {
        if (window.cv && cv.Mat)
            return res();
        if (window.cv && typeof cv.then === 'function') {
            cv.then(m => {
                window.cv = m;
                res();
            });
            return;
        }
        if (++n > 600)
            return rej(new Error('OpenCV.js did not load. Check your connection and reload.'));
        setTimeout(chk, 100);
    })();
});
// Distance between two [x, y] points.
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
// Point at fraction t along the line from a to b (t > 1 extrapolates beyond b).
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
// Is point p inside convex polygon q? The point must lie on the same side of every edge (cross-product sign test).
const inQ = (p, q) => {
    let s = 0;
    for (let i = 0; i < 4; i++) {
        const a = q[i], b = q[(i + 1) % 4], c = (b[0] - a[0]) * (p[1] - a[1]) - (b[1] - a[1]) * (p[0] - a[0]);
        if (c) {
            if (s && Math.sign(c) !== s)
                return false;
            s = Math.sign(c);
        }
    }
    return true;
};
// Order four corner points as [top-left, top-right, bottom-right, bottom-left] using x+y and y-x extremes.
function order(P) {

{

// ==================== Title-bar finder: long parallel edges (card top edge + line under the title) ====================

// ==================== Run ====================
// Main flow for a new photo: load it, detect cards (outlines, then title bars), OCR and identify them.
async function run(file) {
    if (!file)

    cards = [];
    marks = [];
    taken = [];
    target = null;
    drawMode = false;
    selected = null;
    $('list').innerHTML = '';
    showErr('');
    exportBar();
    status('Loading image…');
    try {
        // Load and downscale the photo; on failure show the error and stop.
        srcC = await loadImage(file);
    }
    catch (e) {
        srcC = null;
        $('manualBtn').disabled = true;
        status('');
        return showErr(e.message);
    }
    $('manualBtn').disabled = false;
    {
        // Show the photo (and the overlay on top of it) right away so it stays visible during and after identification.
        const sc = $('src');
        sc.width = srcC.width;
        sc.height = srcC.height;
        sc.getContext('2d').drawImage(srcC, 0, 0);
        $('photo').hidden = false;
        setHelp();
        drawOv();

    namesReady.catch(e => showErr(e.message));
    try {
        status('Starting OpenCV…');
        await cvReady;
    }
    catch (e) {
        status('');
        return showErr(e.message);
    }
    status('Looking for cards…');

        // Step 1: outline detection (any failure just means no outlines are found).
        found = detect(srcC);

    catch (e) {
        console.error(e);

// ==================== Export ====================
// Build the export rows from the cards currently shown: skip unmatched ones unless 'Include unmatched' is ticked,
// skip unconfirmed ones if 'Only confirmed' is ticked, and group identical cards into one row with a quantity.
function rows() {
    const inc = $('inc').checked, map = new Map();
    for (const c of cards) {
        const un = !c.scry;
        if (un && !inc)
            continue;
        if ($('onlyc').checked && !c.confirmed)
            continue;
        const name = un ? (c.name || c.ocr || '(unreadable)') : c.scry.name, k = (un ? '?' : '') + name.toLowerCase();
        let r = map.get(k);
        if (!r)

// CSV escaping: wrap fields containing commas, quotes or line breaks in quotes and double any quotes.
const esc = s => /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
// Create the text for the chosen format: 'json', 'txt' (one '2 Lightning Bolt' per line) or CSV (default).
function build(f) {
    const R = rows();
    if (f === 'json')

    return ['Quantity,Name,Set,Collector Number,Gatherer URL', ...R.map(r => [r.qty, esc(r.name), esc(r.set), esc(r.cn), esc(r.url)].join(','))].join('\r\n');
}
// Show/hide the export bar and refresh the count line and the enabled state of the buttons.
function exportBar() {
    $('export').hidden = !cards.length;
    const R = rows();
    $('count').textContent = R.reduce((n, r) => n + r.qty, 0) + ' cards · ' + R.length + ' unique · ' + cards.filter(c => c.confirmed).length + ' of ' + cards.length + ' confirmed' + (cards.some(c => !c.scry) && !$('inc').checked ? ' · unresolved cards left out' : '');

}
$('inc').onchange = $('onlyc').onchange = exportBar;
// Download: create the file in memory as a Blob and click a temporary link. CSV gets a UTF-8 BOM so Excel shows accents correctly.
$('dlBtn').onclick = () => {

    const blob = new Blob([f === 'csv' ? '\ufeff' + text : text], { type: mime + ';charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'mtg-cards-' + new Date().toLocaleDateString('en-CA') + '.' + f;
    document.body.appendChild(a);

    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
// Copy the plain-text deck list to the clipboard (with a fallback for browsers that block the clipboard API).
$('cpBtn').onclick = async () => {
    const t = build('txt'), b = $('cpBtn');

        await navigator.clipboard.writeText(t);
    }
    catch (e) {
        const x = document.createElement('textarea');
        x.value = t;

        x.select();
        document.execCommand('copy');

    }
